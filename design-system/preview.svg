      <text x="38" y="50" fill="#8A94A6" font-size="11">payments enterprise billing clean elev...</text>
      <rect x="235" y="24" width="70" height="28" rx="6" fill="#7A73FF"/>
      <text x="249" y="42" fill="#ffffff" font-size="11" font-weight="600">Select</text>
    </g>
    <!-- Alternative 2 -->
