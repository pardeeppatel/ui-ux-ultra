<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" style="border-radius:14px; background:#08090C; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Recommended Main Card -->
