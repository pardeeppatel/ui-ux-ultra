      <rect width="320" height="78" rx="10" fill="#11131A" stroke="#222634" stroke-width="1"/>
      <circle cx="22" cy="28" r="7" fill="#FFFFFF"/>
      <text x="38" y="32" fill="#F3F4F6" font-size="13" font-weight="600">Geist Monochrome & Signal</text>
      <text x="38" y="50" fill="#8A94A6" font-size="11">minimalist cloud edge deployment stark...</text>
      <rect x="235" y="24" width="70" height="28" rx="6" fill="#FFFFFF"/>
      <text x="249" y="42" fill="#ffffff" font-size="11" font-weight="600">Select</text>
    </g>
